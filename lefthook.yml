# Lefthook Configuration
# Refer to https://github.com/evilmartians/lefthook for more details

glob_matcher: doublestar

pre-commit:
  parallel: false # 关闭并行，保持流程清晰
  commands:
    "前端_代码格式化":
      glob: "src/**/*.{ts,tsx,json,css}"
      run: pnpm check:apply {staged_files}
      stage_fixed: true
    "后端_代码格式化":
      glob: "src-tauri/**/*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
    "前端_TypeScript类型检查":
      run: pnpm typecheck # 全量检查，确保类型安全
    "后端_Rust静态代码检查(Clippy)":
      glob: "src-tauri/**/*"
      run: cargo clippy --manifest-path src-tauri/Cargo.toml -p animesh_core -- -D warnings

pre-push:
  parallel: false
  commands:
    "前端_表现层规范检查":
      glob: "src/presentation/**/*.{ts,tsx}"
      run: pnpm check:presentation {push_files}
    "前端_应用层规范检查":
      glob: "src/{application,infrastructure}/**/*.{ts,tsx}"
      run: pnpm check:application {push_files}
    "前端_接口契约检查":
      glob: "src/**/*.{ts,tsx}"
      run: pnpm check:interface {push_files}
    "前端_函数方法长度检查":
      glob: "src/**/*.{ts,tsx}"
      run: pnpm check:function-length {push_files}
    "前端_死代码检查":
      run: pnpm check:dead-code
    "前端_Knip死代码检查":
      run: pnpm knip
    "前端_DI容器架构检查":
      run: pnpm check:di
    "前端_测试文件一一对应检查":
      glob: "src/**/*.{ts,tsx}"
      run: pnpm check:test-files {push_files}
    "后端_异步命令检查":
      run: pnpm check:tauri-commands
    "前端_单元测试与覆盖率":
      run: pnpm test:coverage # 全量测试及覆盖率阈值检查
    "后端_Rust单元测试与覆盖率":
      glob: "src-tauri/**/*"
      run: pnpm test:rust:coverage