# Lefthook Configuration
# Refer to https://github.com/evilmartians/lefthook for more details

glob_matcher: doublestar

pre-commit:
  parallel: false # 关闭并行，保持流程清晰
  commands:
    "前端_代码格式化":
      glob: "src/**/*.{ts,tsx,json,css}"
      run: pnpm check:apply {staged_files}
      stage_fixed: true
    "后端_代码格式化":
      glob: "src-tauri/**/*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
    "前端_TypeScript类型检查":
      run: pnpm typecheck # 全量检查，确保类型安全
    "后端_Rust静态代码检查(Clippy)":
      glob: "src-tauri/**/*"
      run: cargo clippy --manifest-path src-tauri/Cargo.toml -p animesh_core -- -D warnings

pre-push:
  parallel: false
  commands:
    "前端_错误处理规范检查":
      glob: "src/**/*.{ts,tsx}"
      run: pnpm check:error-handling {push_files}
    "前端_接口设计参数检查":
      glob: "src/application/**/*.{ts,tsx}"
      run: pnpm check:application-params {push_files}
    "前端_接口可空设计检查":
      glob: "src/**/*.{ts,tsx}"
      run: pnpm check:interface-methods {push_files}
    "前端_函数方法长度检查":
      glob: "src/**/*.{ts,tsx}"
      run: pnpm check:function-length {push_files}
    "前端_表现层Tauri导入检查":
      glob: "src/presentation/**/*.{ts,tsx}"
      run: pnpm check:presentation-tauri-imports {push_files}
    "前端_表现层样式检查":
      glob: "src/presentation/**/*.{ts,tsx}"
      run: pnpm check:presentation-styles {push_files}
    "前端_DI容器架构检查":
      run: pnpm check:di
    "前端_应用层死代码检查":
      run: pnpm check:application-dead-code
    "前端_接口实现契约检查":
      run: pnpm check:interface-conformance {push_files}
    "前端_基础设施死代码检查":
      run: pnpm check:infrastructure-dead-code {push_files}
    "前端_依赖注入规范检查":
      glob: "src/{application,infrastructure}/**/*.{ts,tsx}"
      run: pnpm check:dependency-injection {push_files}
    "前端_表现层useDI使用检查":
      glob: "src/presentation/**/*.{ts,tsx}"
      run: pnpm check:presentation-di {push_files}
    "前端_表现层deps接口检查":
      glob: "src/presentation/**/*.{ts,tsx}"
      run: pnpm check:presentation-deps {push_files}
    "前端_表现层测试DI注入检查":
      glob: "src/presentation/**/*.{ts,tsx}"
      run: pnpm check:presentation-test-di {push_files}
    "后端_异步命令检查":
      run: pnpm check:tauri-commands
    "前端_单元测试与覆盖率":
      run: pnpm test:coverage # 全量测试及覆盖率阈值检查
    "后端_Rust单元测试与覆盖率":
      glob: "src-tauri/**/*"
      run: pnpm test:rust:coverage
